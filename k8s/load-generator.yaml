# Traffic control knob for the demo. Scale this up to generate load against
# pulse-api and watch the HPA add pods; scale it back to 0 and watch it
# scale back down.
#
#   kubectl scale deployment/load-generator --replicas=6   # ramp up
#   kubectl scale deployment/load-generator --replicas=0   # stop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 0
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while true; do wget -q -O- http://pulse-api/health; done"
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 200m

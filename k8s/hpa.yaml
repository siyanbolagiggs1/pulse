apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulse-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      # Default is 300s; this is a demo cluster so a shorter cooldown keeps
      # the scale-down watchable without editing during a recording. Bump
      # this back up (or delete the override) for anything beyond a demo.
      stabilizationWindowSeconds: 60
